name: isar_generator
description: Code generator for the Isar Database. Finds classes annotated with @Collection.
version: 3.1.8
repository: https://github.com/isar-community/isar
homepage: https://isar.dev
publish_to: https://pub.isar-community.dev/

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  analyzer: ">=4.6.0 <7.0.0"
  build: ^2.3.0
  dart_style: ^2.2.3
  dartx: ^1.1.0
  glob: ^2.0.2
  isar:
    path: ../isar # Isso significa: vá uma pasta acima (para 'packages') e então para a pasta 'isar'
  # A dependência 'path' do dart deve ser mantida se for usada em seu código
  path: ^1.8.1 # Esta é a biblioteca 'path' do Dart, não o caminho para o Isar
  source_gen: ^1.2.2
  xxh3: ^1.0.1

dev_dependencies:
  build_test: ^2.1.5
  matcher: ^0.12.12
  test: ^1.21.0
  very_good_analysis: ^3.0.1
